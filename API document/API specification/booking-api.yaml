openapi: 3.0.3
info:
  title: Booking Service API
  description: API for creating, viewing and cancelling trips. Implements BR01-BR04, FR01-FR04, UC01 and AC01-AC03.
  version: 1.0.0
servers:
  - url: http://localhost:8081/api/v1
    description: Local Booking Service

tags:
  - name: Trips
    description: Trip booking operations

paths:
  /trips:
    post:
      tags: [Trips]
      summary: Create a trip
      operationId: createTrip
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: Trip created with SEARCHING status (AC01)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Missing or invalid pickup/destination (AC02, AC03)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required

  /trips/{tripId}:
    get:
      tags: [Trips]
      summary: Get trip details
      operationId: getTrip
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Trip details returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '404':
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trips/{tripId}/cancel:
    post:
      tags: [Trips]
      summary: Cancel a trip
      operationId: cancelTrip
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Trip cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '409':
          description: Trip cannot be cancelled in its current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 1001
  schemas:
    CreateTripRequest:
      type: object
      required: [pickup, destination, vehicleType, paymentMethod]
      properties:
        pickup:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        vehicleType:
          type: string
          enum: [BIKE, CAR]
          description: Vehicle type required by FR04.
        paymentMethod:
          type: string
          enum: [CASH, ONLINE]
        prioritizeHighRating:
          type: boolean
          default: false
    Location:
      type: object
      required: [address, latitude, longitude]
      properties:
        address:
          type: string
          minLength: 1
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    Trip:
      type: object
      required: [tripId, customerId, pickup, destination, vehicleType, tripStatus, createdAt]
      properties:
        tripId:
          type: integer
          format: int64
        customerId:
          type: integer
          format: int64
        driverId:
          type: integer
          format: int64
          nullable: true
        pickup:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        vehicleType:
          type: string
          enum: [BIKE, CAR]
        paymentMethod:
          type: string
          enum: [CASH, ONLINE]
        prioritizeHighRating:
          type: boolean
        tripStatus:
          type: string
          enum: [SEARCHING, WAITING_DRIVER, MATCHED, IN_PROGRESS, COMPLETED, NO_DRIVER, TIMEOUT, CANCELLED]
        createdAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
